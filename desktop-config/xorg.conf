# nvidia-xconfig: X configuration file generated by nvidia-xconfig
# nvidia-xconfig:  version 575.57.08

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "AllowMouseOpenFail" "true"
    Option "AutoAddGPU" "False"
EndSection

Section "ServerLayout"
    Identifier     "Default Layout"
    Screen      0  "Default Screen"
    InputDevice    "Keyboard0" "CoreKeyboard"
    InputDevice    "Mouse0" "CorePointer"
EndSection

Section "InputDevice"
    # generated from default
    Identifier     "Keyboard0"
    Driver         "kbd"
EndSection

Section "InputDevice"
    # generated from default
    Identifier     "Mouse0"
    Driver         "mouse"
    Option         "Protocol" "auto"
    Option         "Device" "/dev/psaux"
    Option         "Emulate3Buttons" "no"
    Option         "ZAxisMapping" "4 5"
EndSection

Section "Monitor"
    Identifier     "Configured Monitor"
    HorizSync       30.0 - 80.0
    VertRefresh     50.0 - 75.0
    ModeLine       "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection

Section "Device"
    Identifier     "Configured Video Device"
    Driver         "nvidia"
    Option "AllowExternalGpus" "True"
    Option "ModeValidation" "NoEdidModes, NoMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck, NoVirtualSizeCheck, NoExtendedGpuCapabilitiesCheck, NoTotalSizeCheck, NoDualLinkDVICheck, NoDisplayPortBandwidthCheck, AllowNon3DVisionModes, AllowNonHDMI3DModes, AllowNonEdidModes, NoEdidHDMI2Check, AllowDpInterlaced"
    BusID          "PCI:0@1:0:0"
    Option "TripleBuffer" "True"
    Option "AllowFlipping" "True"
    Option "RenderAccel" "True"
EndSection

Section "Screen"
    Identifier     "Default Screen"
    Device         "Configured Video Device"
    Monitor        "Configured Monitor"
    DefaultDepth    24
    Option         "ProbeAllGpus" "False"
    Option         "IncludeImplicitMetaModes" "True"
    Option         "ModeDebug" "True"
    Option         "BaseMosaic" "False"
    Option         "AllowEmptyInitialConfiguration" "True"
    Option         "ConnectedMonitor" "DFP"
    SubSection     "Display"
        Virtual     1920 1080
        Depth       24
        Modes      "1920x1080" "1920x1080_60"
    EndSubSection
EndSection

